<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="Maxwell's demon appears to create order for free; the cost was always in the measurement and memory. The AI version hides the same ledger."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7C8E"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F04B36"/></marker></defs><rect width="1180" height="640" fill="#080E15"/><text x="590.0" y="44" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#31A9F0" text-anchor="middle" font-weight="normal" letter-spacing="3">THE DEMON NEVER GOT A FREE LUNCH</text><text x="590.0" y="68" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">it moved the cost into the bookkeeping, where nobody was looking</text><rect x="50" y="100" width="500" height="300" rx="10" fill="#0E1620" stroke="#22344A"/><text x="76" y="130" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="start" font-weight="normal" letter-spacing="2">1867 — MAXWELL</text><rect x="90" y="160" width="180" height="150" rx="4" fill="#0B121B" stroke="#22344A"/><rect x="330" y="160" width="180" height="150" rx="4" fill="#0B121B" stroke="#22344A"/><line x1="300" y1="160" x2="300" y2="215" stroke="#22344A" stroke-width="2"/><line x1="300" y1="255" x2="300" y2="310" stroke="#22344A" stroke-width="2"/><circle cx="300" cy="228" r="11" fill="#E8B84B"/><path d="M293,220 L290,212 M307,220 L310,212" stroke="#E8B84B" stroke-width="2.5" fill="none"/><circle cx="155" cy="193" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="201" cy="184" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="185" cy="219" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="118" cy="236" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="115" cy="227" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="120" cy="186" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="169" cy="274" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="127" cy="202" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="198" cy="289" r="4" fill="#31A9F0" opacity="0.85"/><circle cx="431" cy="223" r="4" fill="#E8B84B" opacity="0.9"/><circle cx="487" cy="181" r="4" fill="#E8B84B" opacity="0.9"/><circle cx="470" cy="210" r="4" fill="#E8B84B" opacity="0.9"/><circle cx="370" cy="189" r="4" fill="#E8B84B" opacity="0.9"/><circle cx="393" cy="273" r="4" fill="#E8B84B" opacity="0.9"/><circle cx="375" cy="245" r="4" fill="#E8B84B" opacity="0.9"/><circle cx="439" cy="220" r="4" fill="#E8B84B" opacity="0.9"/><circle cx="427" cy="183" r="4" fill="#E8B84B" opacity="0.9"/><circle cx="358" cy="200" r="4" fill="#E8B84B" opacity="0.9"/><text x="180" y="336" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#31A9F0" text-anchor="middle" font-weight="normal" letter-spacing="0">cold</text><text x="420" y="336" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E8B84B" text-anchor="middle" font-weight="normal" letter-spacing="0">hot</text><text x="300" y="366" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#C6D3E0" text-anchor="middle" font-weight="normal" letter-spacing="0">order from disorder — apparently for free</text><text x="300" y="386" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">the second law, violated by a doorman</text><rect x="630" y="100" width="500" height="300" rx="10" fill="#0E1620" stroke="#22344A"/><text x="656" y="130" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="start" font-weight="normal" letter-spacing="2">2026 — THE AI VERSION</text><rect x="666" y="158" width="120" height="14" rx="3" fill="#16202C" stroke="#22344A" stroke-width="0.8"/><rect x="666" y="180" width="120" height="14" rx="3" fill="#16202C" stroke="#22344A" stroke-width="0.8"/><rect x="666" y="202" width="120" height="14" rx="3" fill="#16202C" stroke="#22344A" stroke-width="0.8"/><rect x="666" y="224" width="120" height="14" rx="3" fill="#16202C" stroke="#22344A" stroke-width="0.8"/><rect x="666" y="246" width="120" height="14" rx="3" fill="#16202C" stroke="#22344A" stroke-width="0.8"/><rect x="666" y="268" width="120" height="14" rx="3" fill="#16202C" stroke="#22344A" stroke-width="0.8"/><text x="726" y="300" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">a million proposals</text><circle cx="856" cy="220" r="13" fill="#E8B84B"/><path d="M848,211 L845,202 M864,211 L867,202" stroke="#E8B84B" stroke-width="2.5" fill="none"/><text x="856" y="258" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#E8B84B" text-anchor="middle" font-weight="normal" letter-spacing="0">sorts them</text><line x1="792" y1="220" x2="838" y2="220" stroke="#6B7C8E" stroke-width="1.5" marker-end="url(#a)"/><line x1="876" y1="220" x2="922" y2="220" stroke="#6B7C8E" stroke-width="1.5" marker-end="url(#a)"/><rect x="932" y="192" width="130" height="16" rx="3" fill="#0F2233" stroke="#31A9F0" stroke-width="0.9"/><rect x="932" y="216" width="130" height="16" rx="3" fill="#0F2233" stroke="#31A9F0" stroke-width="0.9"/><rect x="932" y="240" width="130" height="16" rx="3" fill="#0F2233" stroke="#31A9F0" stroke-width="0.9"/><text x="997" y="300" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#31A9F0" text-anchor="middle" font-weight="normal" letter-spacing="0">the good ones</text><text x="880" y="366" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#C6D3E0" text-anchor="middle" font-weight="normal" letter-spacing="0">value from nothing — apparently for free</text><text x="880" y="386" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">nobody is metering the sorting</text><rect x="50" y="428" width="1080" height="150" rx="10" fill="#160E0C" stroke="#F04B36" stroke-width="1.5"/><text x="76" y="458" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#F04B36" text-anchor="start" font-weight="normal" letter-spacing="2">THE LEDGER — WHERE THE COST ACTUALLY WENT</text><text x="150" y="502" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#EAF0F6" text-anchor="middle" font-weight="600" letter-spacing="0">MEASURE</text><text x="150" y="524" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">which molecule is fast?</text><line x1="290" y1="510" x2="310" y2="510" stroke="#F04B36" stroke-width="1.5" marker-end="url(#ar)"/><text x="450" y="502" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#EAF0F6" text-anchor="middle" font-weight="600" letter-spacing="0">REMEMBER</text><text x="450" y="524" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">the demon must hold the answer</text><line x1="590" y1="510" x2="630" y2="510" stroke="#F04B36" stroke-width="1.5" marker-end="url(#ar)"/><text x="770" y="502" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#EAF0F6" text-anchor="middle" font-weight="600" letter-spacing="0">ERASE</text><text x="770" y="524" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">kT ln 2 per bit — irreducible</text><text x="590.0" y="558" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#31A9F0" text-anchor="middle" font-weight="normal" letter-spacing="0">AlphaClaw&#8217;s version of the same rule: missing usage invalidates the run rather than being recorded as zero</text><text x="590.0" y="612" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#EAF0F6" text-anchor="middle" font-weight="600" letter-spacing="1">unknown cost is not zero cost</text></svg>