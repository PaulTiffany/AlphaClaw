<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" role="img" aria-label="The raw provider receipt is written first; ThreadKeeper is a second, isolated accounting witness">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7C8E"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#31A9F0"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F04B36"/></marker></defs>
<rect width="1180" height="400" fill="#080E15"/>
<text x="590.0" y="40" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#31A9F0" text-anchor="middle" font-weight="normal" letter-spacing="2.5">RECEIPT FIRST, WITNESS SECOND</text><rect x="60" y="86" width="220" height="58" rx="6" fill="#0E1620" stroke="#22344A" stroke-width="1.5"/><text x="170.0" y="111.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#C6D3E0" text-anchor="middle">stock Omega</text><text x="170.0" y="133.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="middle">OpenAIAPI request</text><line x1="280" y1="115" x2="314" y2="115" stroke="#6B7C8E" stroke-width="1.5" marker-end="url(#a)"/><rect x="320" y="86" width="220" height="58" rx="6" fill="#0E1620" stroke="#31A9F0" stroke-width="1.5"/><text x="430.0" y="111.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#31A9F0" text-anchor="middle">host gateway</text><text x="430.0" y="133.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="middle">model + call-ceiling check</text><line x1="540" y1="115" x2="574" y2="115" stroke="#6B7C8E" stroke-width="1.5" marker-end="url(#a)"/><rect x="580" y="86" width="220" height="58" rx="6" fill="#0E1620" stroke="#22344A" stroke-width="1.5"/><text x="690.0" y="111.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#C6D3E0" text-anchor="middle">real provider</text><text x="690.0" y="133.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="middle">returns usage</text><line x1="690" y1="144" x2="690" y2="186" stroke="#31A9F0" stroke-width="1.5" marker-end="url(#ab)"/><rect x="540" y="190" width="300" height="58" rx="6" fill="#0E1620" stroke="#31A9F0" stroke-width="1.5"/><text x="690.0" y="215.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#EAF0F6" text-anchor="middle">provider_usage.jsonl</text><text x="690.0" y="237.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="middle">PRIMARY EVIDENCE — written first</text><line x1="690" y1="248" x2="690" y2="290" stroke="#31A9F0" stroke-width="1.5" marker-end="url(#ab)"/><rect x="540" y="294" width="300" height="54" rx="6" fill="#0E1620" stroke="#22344A" stroke-width="1.5"/><text x="690.0" y="317.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#C6D3E0" text-anchor="middle">token counts only</text><text x="690.0" y="339.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="middle">no keys, no prompts, no responses</text><line x1="540" y1="321" x2="546" y2="321" stroke="#6B7C8E" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="294" width="250" height="54" rx="6" fill="#0E1620" stroke="#22344A" stroke-width="1.5"/><text x="415.0" y="317.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#C6D3E0" text-anchor="middle">threadkeeper</text><text x="415.0" y="339.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="middle">isolated python -I worker</text><line x1="290" y1="321" x2="286" y2="321" stroke="#6B7C8E" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="294" width="220" height="54" rx="6" fill="#0E1620" stroke="#22344A" stroke-width="1.5"/><text x="170.0" y="317.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#C6D3E0" text-anchor="middle">usage.jsonl</text><text x="170.0" y="339.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6B7C8E" text-anchor="middle">accounting witness</text><line x1="410" y1="190" x2="410" y2="144" stroke="#6B7C8E" stroke-width="1.5" marker-end="url(#a)"/><text x="470" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">unchanged response back to Omega</text><line x1="410" y1="190" x2="650" y2="190" stroke="#6B7C8E" stroke-width="1.5"/><text x="590.0" y="382" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#6B7C8E" text-anchor="middle" font-weight="normal" letter-spacing="0">a witness failure invalidates certification — it cannot erase the provider receipt</text></svg>