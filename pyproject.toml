[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# OmegaBoi is outer orchestration glue: it deliberately loads repo-local modules
# after setting import paths and retries the pinned upstream mock RPC while the
# disposable container is still connecting.
"controller/omegaboi.py" = ["E402", "I001", "TRY004", "S110", "BLE001"]
