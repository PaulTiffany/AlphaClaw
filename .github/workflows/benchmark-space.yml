name: Synchronize benchmark Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Hugging Face Hub client
        run: python -m pip install huggingface_hub==1.24.0

      - name: Synchronize disposable benchmark lab
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_SPACE_PRIVATE: ${{ vars.HF_SPACE_PRIVATE }}
        run: python benchmarks/huggingface/sync_space.py
