name: Publish Chad frontier keepers

on:
  push:
    branches: [chad-frontier-keepers]
    paths:
      - '.github/workflows/publish-chad-frontier.yml'

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: chad-frontier-keepers

      - name: Download verified source artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 \
            -o chad-raster-art.zip \
            'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0f7c-81f5-933d-760afd188851/raw?se=2026-08-21T03%3A29%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=d598cbef-b16e-5fd4-8d46-8927ffdf28db&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T20%3A03%3A28Z&ske=2026-08-21T20%3A03%3A28Z&sks=b&skv=2026-02-06&sig=Wcds%2Ba5%2BD1tis/UnA1pNq9qlU0xP60KA2ywyKeRiqdE%3D'
          test "$(sha256sum chad-raster-art.zip | awk '{print $1}')" = "683b0b091184311ddf466f0db5e308763fd76bebe59313de3699695fc3625c01"
          rm -rf .chad-round15-artifact
          mkdir .chad-round15-artifact
          unzip -q chad-raster-art.zip -d .chad-round15-artifact

      - name: Verify receipts and copy exact raster bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/publish_chad_frontier.py
          python3 .github/scripts/publish_chad_frontier.py

      - name: Commit publication and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f chad-raster-art.zip
          rm -rf .chad-round15-artifact __pycache__ .github/scripts/__pycache__
          rm .github/scripts/publish_chad_frontier.py
          rm .github/workflows/publish-chad-frontier.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- PHILOSOPHY.md assets/chad/PROVENANCE.md \
            assets/chad/capability-not-permission.png \
            assets/chad/test-not-assurance.png \
            assets/chad/change-mind.jpg \
            assets/chad/mechanical-checks.png \
            assets/chad/rest-delegation.png \
            assets/chad/truth-not-winning.png \
            assets/chad/ideas-meet-reality.png \
            assets/chad/recoverable-progress.jpg \
            assets/chad/authorized-gate.png \
            assets/chad/brake-engine-path.png \
            assets/chad/strongest-criticism.png \
            .github/scripts/publish_chad_frontier.py \
            .github/workflows/publish-chad-frontier.yml
          git commit -m 'Publish eleven Chad round 15 keepers'
          git push origin HEAD:chad-frontier-keepers
