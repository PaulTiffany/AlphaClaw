name: Publish Chad art

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-chad-art.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-8e9c-81fb-b7ae-aa636164edd7/raw?se=2026-08-17T14%3A47%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=f0f29d44-f998-5896-9c91-5f7e5eb0b819&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T12%3A36%3A17Z&ske=2026-08-18T12%3A36%3A17Z&sks=b&skv=2026-02-06&sig=843aOeTpnjq733xTQWjWHoMvWQkSpOSzz08lPi16i9Q%3D"
      ARTIFACT_SHA256: "203da34a91bbed821aef73d6fec39cacfd7f2206ae74f9d4d4f729279c42aa4c"
    steps:
      - name: Checkout AlphaClaw
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify Raster Chad artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/chad.zip
          echo "$ARTIFACT_SHA256  /tmp/chad.zip" | sha256sum -c -
          mkdir -p /tmp/chad
          unzip -q /tmp/chad.zip -d /tmp/chad
          test -f /tmp/chad/provenance.jsonl
          test -d /tmp/chad/images

      - name: Install image codec
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Assemble illustrated philosophy and receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          repo = Path.cwd()
          artifact = Path('/tmp/chad')
          out = repo / 'assets' / 'chad'
          out.mkdir(parents=True, exist_ok=True)

          rows = [json.loads(x) for x in (artifact / 'provenance.jsonl').read_text().splitlines() if x.strip()]
          byid = {r['philosophy']['id']: r for r in rows}

          selected = [
              ('fact-not-shame', 'fact-not-shame.jpg', 'BytePlus Model Services terms', 'https://docs.byteplus.com/vi/docs/legal/docs-service-specific-terms', 'BytePlus states that, to the extent permitted by law, output IP rights belong to the customer or other applicable rights holder and BytePlus does not claim ownership.'),
              ('reality-votes', 'reality-votes.jpg', 'Qwen-Image official license', 'https://github.com/QwenLM/Qwen-Image/blob/main/LICENSE', 'Qwen-Image is published under Apache-2.0. This receipt does not claim that a model license itself creates copyright in an output.'),
              ('no-villains', 'no-villains.jpg', 'xAI Consumer FAQ', 'https://x.ai/legal/faq', 'xAI states that users own Grok inputs and outputs, including generated images, and asks users to attribute generated work to Grok.'),
              ('truth-not-reputation', 'truth-not-reputation.jpg', 'Black Forest Labs Developer Terms', 'https://bfl.ai/legal/developer-terms-of-service', 'Black Forest Labs states that, as between the user and BFL, the user owns right, title, and interest in output and may use outputs personally or commercially, subject to its terms.'),
              ('receipts', 'receipts.jpg', 'BytePlus Model Services terms', 'https://docs.byteplus.com/vi/docs/legal/docs-service-specific-terms', 'BytePlus states that, to the extent permitted by law, output IP rights belong to the customer or other applicable rights holder and BytePlus does not claim ownership.'),
              ('play', 'play.jpg', 'Qwen-Image official license', 'https://github.com/QwenLM/Qwen-Image/blob/main/LICENSE', 'Qwen-Image is published under Apache-2.0. This receipt does not claim that a model license itself creates copyright in an output.'),
              ('stop', 'stop.jpg', 'Recraft API Terms', 'https://www.recraft.ai/legal/terms', 'Recraft states that API users own assets created with the API and assigns any copyright it may have, subject to a restriction against using the assets to train AI models, systems, or networks.'),
          ]

          published = {}
          for pid, filename, *_ in selected:
              r = byid[pid]
              assert not r.get('error'), (pid, r.get('error'))
              assert r.get('reference_image_supplied') is False
              src = artifact / 'images' / r['image_file']
              raw = src.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == r['image_sha256'], pid
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  im.thumbnail((520, 650), Image.Resampling.LANCZOS)
                  dst = out / filename
                  im.save(dst, 'JPEG', quality=82, optimize=True, progressive=True)
              published[pid] = hashlib.sha256((out / filename).read_bytes()).hexdigest()

          p = (repo / 'PHILOSOPHY.md').read_text(encoding='utf-8')
          assert 'assets/chad/fact-not-shame.jpg' not in p

          blocks = {
              'fact-not-shame': '''\n<p align="center">\n  <img src="assets/chad/fact-not-shame.jpg" alt="Chad calmly separating a fact from social shame" width="620">\n</p>\n\n<p align="center"><em>annoned by <code>bytedance-seed/seedream-4.5</code> · <a href="assets/chad/PROVENANCE.md#fact-not-shame">receipt</a></em></p>\n''',
              'reality-votes': '''\n<p align="center">\n  <img src="assets/chad/reality-votes.jpg" alt="Chad calmly letting reality cast the deciding vote" width="620">\n</p>\n\n<p align="center"><em>annoned by <code>qwen/qwen-image-3</code> · <a href="assets/chad/PROVENANCE.md#reality-votes">receipt</a></em></p>\n''',
              'no-villains': '''\n<p align="center">\n  <img src="assets/chad/no-villains.jpg" alt="Chad listening to disagreement without inventing a villain" width="620">\n</p>\n\n<p align="center"><em>annoned by <code>x-ai/grok-imagine-image-2.0</code> · <a href="assets/chad/PROVENANCE.md#no-villains">receipt</a></em></p>\n''',
              'truth-not-reputation': '''\n<p align="center">\n  <img src="assets/chad/truth-not-reputation.jpg" alt="Chad separating truth from reputation and social chatter" width="620">\n</p>\n\n<p align="center"><em>annoned by <code>black-forest-labs/flux.2-pro</code> · <a href="assets/chad/PROVENANCE.md#truth-not-reputation">receipt</a></em></p>\n''',
              'receipts': '''\n<p align="center">\n  <img src="assets/chad/receipts.jpg" alt="Chad preserving receipts and checking the claim" width="620">\n</p>\n\n<p align="center"><em>annoned by <code>bytedance-seed/seedream-5-0-pro</code> · <a href="assets/chad/PROVENANCE.md#receipts">receipt</a></em></p>\n''',
              'play': '''\n<p align="center">\n  <img src="assets/chad/play.jpg" alt="Chad in a business suit joyfully building a sandcastle" width="620">\n</p>\n\n<p align="center"><em>annoned by <code>qwen/qwen-image-3-pro</code> · <a href="assets/chad/PROVENANCE.md#play">receipt</a></em></p>\n''',
              'stop': '''\n<p align="center">\n  <img src="assets/chad/stop.jpg" alt="Chad quietly drinking coffee after enough has been said" width="620">\n</p>\n\n<p align="center"><em>annoned by <code>recraft/recraft-v4</code> · <a href="assets/chad/PROVENANCE.md#stop">receipt</a></em></p>\n''',
          }
          repls = [
              ('\\[\n\\text{accept the fact} \\neq \\text{accept the shame}\n\\]\n', '\\[\n\\text{accept the fact} \\neq \\text{accept the shame}\n\\]\n' + blocks['fact-not-shame']),
              ('The point is to find out what is actually true.\n', 'The point is to find out what is actually true.\n' + blocks['reality-votes']),
              ('## Do not invent villains\n', '## Do not invent villains\n' + blocks['no-villains']),
              ('> “People will think badly of me for saying it.”\n', '> “People will think badly of me for saying it.”\n' + blocks['truth-not-reputation']),
              ('**Keep the receipts. Then check the claim.**\n', '**Keep the receipts. Then check the claim.**\n' + blocks['receipts']),
              ('Then play.\n', 'Then play.\n' + blocks['play']),
              ('More words are not necessarily more wisdom.\n', 'More words are not necessarily more wisdom.\n' + blocks['stop']),
          ]
          for old, new in repls:
              assert old in p, old
              p = p.replace(old, new, 1)
          note = '\n> **Illustration note.** The Chad figures below are original AI-generated interpretations of the philosophy lines they accompany. No canonical Chad/Wojak/GigaChad image was supplied as a reference. Each image is attributed to the generating model; exact generation and rights receipts live in [`assets/chad/PROVENANCE.md`](assets/chad/PROVENANCE.md).\n'
          p = p.replace('# Chad Philosophy\n', '# Chad Philosophy\n' + note, 1)
          (repo / 'PHILOSOPHY.md').write_text(p, encoding='utf-8')

          receipt = [
              '# Chad art provenance', '',
              'These images are original raster generations selected from **Raster Chad** run #3 in `PaulTiffany/letGPTsustakethewheel` (GitHub Actions run `32037144396`).', '',
              'No reference image was supplied. The generation prompt explicitly requested a new Chad-like archetype while forbidding reproduction or close imitation of specific Yes Chad / Nordic Gamer / Wojak / Virgin-vs-Chad drawings, GigaChad photographs, celebrities, copyrighted characters, logos, or named artists\' styles.', '',
              'The published JPEGs are web-optimized derivatives of the original generated raster files: resize/re-encode only, with no generative edit. The original generation SHA-256 and published-file SHA-256 are both recorded below.', '',
              '## Rights boundary', '',
              '- Provider/model terms were reviewed on **2026-08-17** before publication.',
              '- This file records the publication basis; it is not a warranty of copyrightability, uniqueness, or non-infringement.',
              '- The generated art is **not relicensed under AlphaClaw\'s MIT software license** merely by being stored in this repository.',
              '- The Recraft API asset carries an additional provider restriction: it may not be used to train external AI models, systems, or networks.',
              '- `sourceful/riverflow-v2-fast` was deliberately **not published** because the output-ownership condition located for Riverflow was not clear enough for this gate.', '',
              '## Generation receipts', ''
          ]
          for pid, filename, label, url, rights_note in selected:
              r = byid[pid]
              receipt += [
                  f'### {pid}', '',
                  f'- Philosophy line: **{r["philosophy"]["line"]}**',
                  f'- Model: `{r["model"]}`',
                  f'- Routed provider: `{r["provider_tag"]}`',
                  f'- Generation cost reported by OpenRouter: `${float(r.get("actual_cost_usd") or 0):.4f}`',
                  '- Reference image supplied: **no**',
                  f'- Original run file: `{r["image_file"]}`',
                  f'- Original generation SHA-256: `{r["image_sha256"]}`',
                  f'- Published file: `{filename}`',
                  f'- Published SHA-256: `{published[pid]}`',
                  f'- Rights/source review: {label} — {url}',
                  f'- Publication note: {rights_note}', ''
              ]
          receipt += [
              '## Why “annoned by”?', '',
              '`annoned by <model>` is a playful provenance caption, not a claim that a model is a legal person or copyright author. It means: **this exact model produced the source raster for this illustration, and the receipt is preserved here.**', '',
              '## Blob → goo', '',
              'A small implementation rule from the publication process: **treat a blob as a blob.** Binary image bytes, Git blobs, Markdown text, and generation receipts are different objects with different invariants. Forgetting the distinction is how structured artifacts turn into output goo.', ''
          ]
          (out / 'PROVENANCE.md').write_text('\n'.join(receipt), encoding='utf-8')
          PY

      - name: Commit exact publication tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/publish-chad-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHILOSOPHY.md assets/chad .github/workflows/publish-chad-art.yml
          git diff --cached --stat
          git commit -m "Illustrate Chad philosophy"
          git push origin HEAD:main
