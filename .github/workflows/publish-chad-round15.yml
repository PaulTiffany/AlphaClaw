name: Publish Chad round 15 keepers

on:
  push:
    branches: [chad-round15-keepers-ritual]
    paths:
      - '.github/workflows/publish-chad-round15.yml'

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: chad-round15-keepers-ritual

      - name: Download verified source artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 \
            -o chad-raster-art.zip \
            'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5e20-81f5-bf9f-d01d368e1495/raw?se=2026-08-21T00%3A48%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=43bae4d6-e60e-59ee-a57f-583585ee3ef1&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T22%3A08%3A07Z&ske=2026-08-21T22%3A08%3A07Z&sks=b&skv=2026-02-06&sig=hOOQzhtgyK41v8ZuTvzikQs5ueKU98S/lyyRTZsWLiw%3D'

      - name: Verify receipts and copy exact raster bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/publish_chad_round15.py
          python3 .github/scripts/publish_chad_round15.py

      - name: Commit publication and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f chad-raster-art.zip
          rm -rf .chad-round15-artifact __pycache__ .github/scripts/__pycache__
          rm .github/scripts/publish_chad_round15.py
          rm .github/workflows/publish-chad-round15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- PHILOSOPHY.md assets/chad/PROVENANCE.md \
            assets/chad/capability-not-permission.png \
            assets/chad/test-not-assurance.png \
            assets/chad/change-mind.jpg \
            assets/chad/mechanical-checks.png \
            assets/chad/rest-delegation.png \
            assets/chad/truth-not-winning.png \
            assets/chad/ideas-meet-reality.png \
            assets/chad/recoverable-progress.jpg \
            assets/chad/authorized-gate.png \
            assets/chad/brake-engine-path.png \
            assets/chad/strongest-criticism.png \
            .github/scripts/publish_chad_round15.py \
            .github/workflows/publish-chad-round15.yml
          git commit -m 'Publish eleven Chad round 15 keepers'
          git push origin HEAD:chad-round15-keepers-ritual
