name: OpenRouter model census

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull and normalize OpenRouter model catalog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY" || {
            echo "Add repository secret OPENROUTER_API_KEY before running the live census."
            exit 1
          }
          python selection/openrouter_models.py \
            --omega-source OmegaClaw-Core \
            --output /tmp/openrouter-model-census.json

      - name: Preserve census
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-model-census
          path: /tmp/openrouter-model-census.json
          retention-days: 7
