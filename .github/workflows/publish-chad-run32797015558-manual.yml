name: Publish Chad run 32797015558

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AlphaClaw
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fixed generation artifact
        env:
          ARTIFACT_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-4f0c-81f7-8e03-ce6c4cc3633b/raw?se=2026-08-25T01%3A35%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=c438ad26-88a3-5549-8a1a-6ea474da6d3e&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T21%3A41%3A54Z&ske=2026-08-25T21%3A41%3A54Z&sks=b&skv=2026-02-06&sig=0CYwp0vB1gm//sCNutBnhC%2Bn2JW18wQXSIkqMMUOFew%3D"
          ZIP: chad-raster-art-32797015558.zip
          EXPECTED_SHA: 283f30685d81d37be598f9411b3a84d0c4fc1933505fbeb9796cf59256365261
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o "$ZIP"
          printf '%s  %s\n' "$EXPECTED_SHA" "$ZIP" | sha256sum --check --strict

      - name: Publish verified keepers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/publish_chad_run32797015558.py
          python3 .github/scripts/publish_chad_run32797015558.py

      - name: Remove temporary publication machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f chad-raster-art-32797015558.zip
          rm -f .github/scripts/publish_chad_run32797015558.py
          rm -f .github/workflows/publish-chad-run32797015558-manual.yml

      - name: Stage and verify exact publication delta
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            PHILOSOPHY.md \
            assets/chad/PROVENANCE.md \
            assets/chad/plan-survives-failure.jpg \
            assets/chad/better-method-not-authority.webp \
            .github/scripts/publish_chad_run32797015558.py \
            .github/workflows/publish-chad-run32797015558-manual.yml

          echo '--- staged name-status ---'
          git diff --cached --name-status

          cat > /tmp/expected-files <<'EOF'
          .github/scripts/publish_chad_run32797015558.py
          .github/workflows/publish-chad-run32797015558-manual.yml
          PHILOSOPHY.md
          assets/chad/PROVENANCE.md
          assets/chad/better-method-not-authority.webp
          assets/chad/plan-survives-failure.jpg
          EOF
          sed -i 's/^          //' /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit and push publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish two Chad keepers from run 32797015558"
          git push origin HEAD:main
