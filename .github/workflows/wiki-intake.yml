name: Compile Wiki contributor intake

on:
  gollum:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wiki-contributor-intake
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Clone public Wiki history
        run: git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/alphaclaw-wiki

      - name: Restore pending review records if a Wiki intake PR is already open
        run: |
          if git fetch origin wiki-intake:refs/remotes/origin/wiki-intake 2>/dev/null; then
            git checkout refs/remotes/origin/wiki-intake -- contributions/wiki/generated 2>/dev/null || true
          fi

      - name: Compile explicitly ready Wiki pages
        run: |
          python contributor/wiki_intake.py \
            --wiki-dir /tmp/alphaclaw-wiki \
            --output-dir contributions/wiki/generated \
            --repository "$GITHUB_REPOSITORY"

      - name: Stop when the compiled intake is unchanged
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- contributions/wiki/generated)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish review branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions/wiki/generated
          git commit -m "Compile ready Wiki contributor intake"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:wiki-intake

      - name: Open review pull request if needed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --head wiki-intake --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --head wiki-intake \
              --base main \
              --title "Review ready Wiki contributions" \
              --body $'Generated from Wiki pages explicitly marked **Ready for review: yes**.\n\nThis is a pedagogical human-development path, not an AlphaClaw sensory ingress or OmegaClaw runtime authority path. Each immutable JSON record is addressed by the exact source Wiki commit and retains the Git author, Wiki path, and SHA-256 of the exact Markdown. Pending records are preserved across later Wiki edits until human review resolves the PR. The compiler executes no Wiki content.\n\nHuman review is required before merge. Do not edit generated records by hand; revise the source Wiki page instead.'
          fi
