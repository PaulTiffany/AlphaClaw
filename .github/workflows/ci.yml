name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned upstream OmegaClaw
        run: |
          test "$(git -C OmegaClaw-Core rev-parse HEAD)" = \
            "3d711e4b9f5254ae94f31123ca242f60cfd97d29"
          test -z "$(git -C OmegaClaw-Core status --porcelain)"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install local test tooling
        run: python -m pip install pytest==9.1.1 ruff==0.16.4

      - name: Lint sensory and controller boundaries
        run: ruff check ingress controller tests

      - name: Keep beginner Wiki surface small
        run: |
          words="$(wc -w < contributor/README.md)"
          test "$words" -le 220
          grep -Fq 'MIT License' contributor/README.md
          grep -Fq 'This Wiki is public' contributor/README.md
          grep -Fq 'Gemini' contributor/README.md
          grep -Fq 'Save Page' contributor/README.md
          grep -Fq '/wiki/_new' contributor/README.md
          ! grep -Eqi '\b(branch|pull request|sha-?256|provenance|runtime|kernel|recursive)\b' contributor/README.md

      - name: Run deterministic tests
        run: pytest -q

      - name: Dry-profile Omega locally with no credentials
        run: |
          destination="$(mktemp -d)/omegaclaw-profiled"
          python controller/omega_profile.py \
            --source OmegaClaw-Core \
            --destination "$destination"
          grep -Fq 'maxNewInputLoops: 8' "$destination/config/config.yaml"
          grep -Fq 'maxWakeLoops: 0' "$destination/config/config.yaml"
          grep -Fq 'maxHistory: 0' "$destination/config/config.yaml"
          grep -Fq 'STATIC_LLM_COMMANDS = {"send"}' "$destination/src/helper.py"
          test "$(grep -c '^- name:' "$destination/config/plugins.yaml")" = 2
          grep -Fq -- '- name: mockchannel' "$destination/config/plugins.yaml"
          grep -Fq -- '- name: mockprovider' "$destination/config/plugins.yaml"
