name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned upstream OmegaClaw
        run: |
          test "$(git -C OmegaClaw-Core rev-parse HEAD)" = \
            "3d711e4b9f5254ae94f31123ca242f60cfd97d29"
          test -z "$(git -C OmegaClaw-Core status --porcelain)"

      - name: Verify benchmark-only ThreadKeeper pin
        run: |
          test "$(git -C external/ThreadKeeper rev-parse HEAD)" = \
            "a64de99e10f9f8078d25bff511b44fd71819e931"
          test -z "$(git -C external/ThreadKeeper status --porcelain)"
          test "$(git ls-files -s external/ThreadKeeper | awk '{print $1, $2}')" = \
            "160000 a64de99e10f9f8078d25bff511b44fd71819e931"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install local test tooling
        run: python -m pip install pytest==9.1.1 ruff==0.16.4

      - name: Lint sensory and controller boundaries
        run: ruff check ingress controller tests

      - name: Keep beginner Wiki surface small
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path('contributor/README.md').read_text()
          visible = re.sub(r'<[^>]+>', ' ', source)
          visible = re.sub(r'!\[([^]]*)\]\([^)]+\)', r'\1', visible)
          visible = re.sub(r'\[([^]]+)\]\([^)]+\)', r'\1', visible)

          words = re.findall(r"\b[\w’'-]+\b", visible)
          assert len(words) <= 220, f"beginner Wiki surface has {len(words)} visible words"

          for phrase in ('MIT License', 'This Wiki is public.', 'Gemini', 'Save Page'):
              assert phrase in visible, f"missing visible phrase: {phrase}"

          assert '/wiki/_new' in source, 'missing direct New Page link'
          assert not re.search(
              r'\b(branch|pull request|sha-?256|provenance|runtime|kernel|recursive)\b',
              visible,
              re.IGNORECASE,
          ), 'advanced vocabulary leaked into beginner Wiki surface'
          PY

      - name: Run deterministic tests
        run: pytest -q

      - name: Dry-profile bounded Omega locally with no credentials
        run: |
          destination="$(mktemp -d)/omegaclaw-profiled"
          python controller/omega_profile.py \
            --source OmegaClaw-Core \
            --destination "$destination" \
            --max-loops 7 \
            --meter
          grep -Fq 'maxNewInputLoops: 7' "$destination/config/config.yaml"
          grep -Fq 'maxWakeLoops: 0' "$destination/config/config.yaml"
          grep -Fq 'maxHistory: 0' "$destination/config/config.yaml"
          grep -Fq 'STATIC_LLM_COMMANDS = {"send"}' "$destination/src/helper.py"
          grep -Fq 'A response ends the current benchmark inference grant' \
            "$destination/src/channels.metta"
          test -f "$destination/providers/alphaclaw_benchmark_meter.py"
          test "$(grep -c '^- name:' "$destination/config/plugins.yaml")" = 2
          grep -Fq -- '- name: mockchannel' "$destination/config/plugins.yaml"
          grep -Fq -- '- name: mockprovider' "$destination/config/plugins.yaml"