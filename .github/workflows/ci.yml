name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned upstream OmegaClaw
        run: |
          test "$(git -C OmegaClaw-Core rev-parse HEAD)" = \
            "3d711e4b9f5254ae94f31123ca242f60cfd97d29"
          test -z "$(git -C OmegaClaw-Core status --porcelain)"

      - name: Verify benchmark-only ThreadKeeper pin
        run: |
          test "$(git -C external/ThreadKeeper rev-parse HEAD)" = \
            "a64de99e10f9f8078d25bff511b44fd71819e931"
          test -z "$(git -C external/ThreadKeeper status --porcelain)"
          test "$(git ls-files -s external/ThreadKeeper | awk '{print $1, $2}')" = \
            "160000 a64de99e10f9f8078d25bff511b44fd71819e931"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install local test tooling
        run: python -m pip install pytest==9.1.1 ruff==0.16.4

      - name: Verify pinned dependency bytes match their pinned blobs
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "controller")
          from omegaboi import verify_omega, verify_threadkeeper

          for name, verify in (
              ("OmegaClaw-Core", verify_omega),
              ("external/ThreadKeeper", verify_threadkeeper),
          ):
              pin = verify()
              print(
                  f"{name}: commit_matches_pin={pin.commit_matches_pin} "
                  f"worktree_bytes_match_pin={pin.worktree_bytes_match_pin}"
              )
              assert pin.commit_matches_pin, f"{name} commit drift"
              assert pin.worktree_bytes_match_pin, f"{name} byte drift"
          PY

      - name: Lint sensory and controller boundaries
        run: ruff check ingress controller tests

      - name: Keep beginner Wiki surface small
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path('contributor/README.md').read_text()
          visible = re.sub(r'<[^>]+>', ' ', source)
          visible = re.sub(r'!\[([^]]*)\]\([^)]+\)', r'\1', visible)
          visible = re.sub(r'\[([^]]+)\]\([^)]+\)', r'\1', visible)

          words = re.findall(r"\b[\w’'-]+\b", visible)
          assert len(words) <= 220, f"beginner Wiki surface has {len(words)} visible words"

          for phrase in ('MIT License', 'This Wiki is public.', 'Gemini', 'Save Page'):
              assert phrase in visible, f"missing visible phrase: {phrase}"

          assert '/wiki/_new' in source, 'missing direct New Page link'
          assert not re.search(
              r'\b(branch|pull request|sha-?256|provenance|runtime|kernel|recursive)\b',
              visible,
              re.IGNORECASE,
          ), 'advanced vocabulary leaked into beginner Wiki surface'
          PY

      - name: Run deterministic tests
        run: pytest -q

      - name: Verify stock Omega benchmark fixture is read-only
        run: |
          test ! -e controller/omega_profile.py
          python controller/inspect_omega.py \
            --source OmegaClaw-Core \
            --output /tmp/omega-state.json
          grep -Fq '3d711e4b9f5254ae94f31123ca242f60cfd97d29' /tmp/omega-state.json
          grep -Fq '"maxNewInputLoops": 50' /tmp/omega-state.json
          grep -Fq '"maxWakeLoops": 1' /tmp/omega-state.json
          test -z "$(git -C OmegaClaw-Core status --porcelain)"
