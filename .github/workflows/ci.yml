name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned upstream OmegaClaw
        run: |
          test -f OmegaClaw-Core/run.metta
          test -f OmegaClaw-Core/lib_omegaclaw.metta
          git submodule status --recursive
          test -z "$(git -C OmegaClaw-Core status --porcelain)"

      - name: Verify Alpha stays outside Omega
        run: |
          test ! -e alphaclaw.metta
          test ! -e run.metta
          test ! -e docker/Dockerfile.overlay
          test ! -e scripts/install-into-petta.sh
          test -f ingress/prepend.py

      - name: Verify resident authority allowlist
        run: |
          grep -Fq 'ASI_ONE_API_KEY:' .github/workflows/omega-space.yml
          grep -Fq 'secrets.ASI_ONE_API_KEY' .github/workflows/omega-space.yml
          if grep -Fq 'HF_OMEGA_SPACE_ID' .github/workflows/omega-space.yml; then
            echo "resident Space target must not be configurable" >&2
            exit 1
          fi
          for forbidden in \
            OPENROUTER_API_KEY \
            ASI_API_KEY \
            OPENAI_API_KEY \
            ANTHROPIC_API_KEY \
            MINIMAX_API_KEY; do
            if grep -Fq "$forbidden" .github/workflows/omega-space.yml; then
              echo "resident workflow exposes forbidden credential: $forbidden" >&2
              exit 1
            fi
          done

      - name: Validate shell bootstrap
        run: bash -n runtime/huggingface/hf_entrypoint.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: python -m pip install pytest ruff

      - name: Lint AlphaClaw, certification, selection, ingress, qualification, runtime, and benchmark lab
        run: ruff check tests certification selection ingress qualification runtime benchmarks

      - name: Certify pinned OmegaClaw residency contract
        run: |
          python certification/certify.py \
            --source OmegaClaw-Core \
            --output /tmp/omegaclaw-residency.json

      - name: Test architecture, selection, ingress, qualification, runtime, and benchmark accounting
        run: pytest -q

      - name: Dry-stage Hugging Face benchmark Space
        run: |
          tmp="$(mktemp -d)"
          python - <<'PY' "$tmp"
          import importlib.util
          import sys
          from pathlib import Path

          destination = Path(sys.argv[1])
          source = Path("benchmarks/huggingface/sync_space.py")
          spec = importlib.util.spec_from_file_location("sync_space", source)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.stage(destination)
          for required in ("Dockerfile", "app.py", "analyze.py", "requirements.txt", "README.md", "LICENSE"):
              assert (destination / required).is_file(), required
          PY

      - name: Dry-stage minimum-authority Omega resident Space
        run: |
          tmp="$(mktemp -d)"
          python runtime/huggingface/stage.py --destination "$tmp"
          for required in \
            Dockerfile \
            Dockerfile.residency \
            README.md \
            LICENSE \
            alphaclaw-runtime.yaml \
            hf_entrypoint.sh \
            health.py; do
            test -f "$tmp/$required"
          done
          test ! -e "$tmp/alphaclaw.metta"
          test ! -e "$tmp/run.metta"
          test ! -e "$tmp/ingress"
          test ! -e "$tmp/OmegaClaw-Core/.git"
          test ! -e "$tmp/AlphaClaw"
          test -f "$tmp/OmegaClaw-Core/run.metta"
          test -f "$tmp/OmegaClaw-Core/Autotests/mock/comm.py"

          loop="$tmp/OmegaClaw-Core/src/loop.metta"
          helper="$tmp/OmegaClaw-Core/src/helper.py"
          skills="$tmp/OmegaClaw-Core/src/skills.metta"
          plugins="$tmp/OmegaClaw-Core/config/plugins.yaml"

          test "$(grep -Fc '(change-state! &loops 0)' "$loop")" = 1
          test "$(grep -Fc '(change-state! &loops (maxNewInputLoops))' "$loop")" = 1
          ! grep -Fq '(and (> $k 1) $msgnew)' "$loop"
          grep -Fq 'collapse (eval (loadOmegaClawPlugin))' "$tmp/OmegaClaw-Core/src/plugin.metta"
          if grep -Fq 'once (eval (loadOmegaClawPlugin))' "$tmp/OmegaClaw-Core/src/plugin.metta"; then
            echo "staged Omega plugin loader was modified" >&2
            exit 1
          fi

          test "$(grep -c '^- name:' "$plugins")" = 2
          grep -Fq -- '- name: wschat' "$plugins"
          grep -Fq -- '- name: asione' "$plugins"
          ! grep -Fq -- '- name: workflow' "$plugins"
          ! grep -Fq -- '- name: openclaw' "$plugins"
          ! grep -Fq -- '- name: openrouter' "$plugins"

          grep -Fq 'STATIC_LLM_COMMANDS = {"send"}' "$helper"
          ! grep -Fq 'LLM_COMMANDS.add' "$helper"
          grep -Fq '(= (getSkills)' "$skills"
          grep -Fq '"- Send message to user: send string"' "$skills"
          ! grep -Fq 'Execute shell command' "$skills"
          ! grep -Fq 'Search the web' "$skills"
          ! grep -Fq 'Execute MeTTa expression' "$skills"
          grep -Fq 'maxHistory: 0' "$tmp/alphaclaw-runtime.yaml"

          PYTHONPATH="$tmp/OmegaClaw-Core" python - <<'PY' "$tmp"
          from src import helper

          assert helper.STATIC_LLM_COMMANDS == {"send"}
          assert helper.LLM_COMMANDS == {"send"}
          assert helper.add_llm_command("shell") is False
          assert helper.LLM_COMMANDS == {"send"}
          assert "UNKNOWN_SKILL_CALL" in helper.balance_parentheses("shell env")
          PY
