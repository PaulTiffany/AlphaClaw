name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify upstream submodule
        run: |
          test -f OmegaClaw-Core/run.metta
          test -f OmegaClaw-Core/lib_omegaclaw.metta
          git submodule status --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
