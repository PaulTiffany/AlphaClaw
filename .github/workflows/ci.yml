name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned upstream OmegaClaw
        run: |
          test "$(git -C OmegaClaw-Core rev-parse HEAD)" = \
            "3d711e4b9f5254ae94f31123ca242f60cfd97d29"
          test -z "$(git -C OmegaClaw-Core status --porcelain)"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install local test tooling
        run: python -m pip install pytest==9.1.1 ruff==0.16.4

      - name: Lint sensory, controller, and contributor boundaries
        run: ruff check ingress controller contributor tests

      - name: Run beginner Wiki guardrails
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("contributor/beginner_surface_guardrails.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          namespace = {"__name__": "__main__"}

          for index, cell in enumerate(notebook["cells"], start=1):
              if cell.get("cell_type") != "code":
                  continue
              source = "".join(cell.get("source", []))
              exec(compile(source, f"{path}:cell-{index}", "exec"), namespace)
          PY

      - name: Run deterministic tests
        run: pytest -q

      - name: Dry-profile Omega locally with no credentials
        run: |
          destination="$(mktemp -d)/omegaclaw-profiled"
          python controller/omega_profile.py \
            --source OmegaClaw-Core \
            --destination "$destination"
          grep -Fq 'maxNewInputLoops: 8' "$destination/config/config.yaml"
          grep -Fq 'maxWakeLoops: 0' "$destination/config/config.yaml"
          grep -Fq 'maxHistory: 0' "$destination/config/config.yaml"
          grep -Fq 'STATIC_LLM_COMMANDS = {"send"}' "$destination/src/helper.py"
          test "$(grep -c '^- name:' "$destination/config/plugins.yaml")" = 2
          grep -Fq -- '- name: mockchannel' "$destination/config/plugins.yaml"
          grep -Fq -- '- name: mockprovider' "$destination/config/plugins.yaml"
