name: Bootstrap contributor Wiki

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-contributor-wiki.yml"
      - "contributor/wiki-templates/**"
  gollum:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-contributor-wiki
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Seed low-friction contributor pages without overwriting edits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wiki=/tmp/alphaclaw-wiki
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone "$remote" "$wiki"; then
            echo "::notice title=One-time Wiki initialization needed::Open the repository Wiki in GitHub, create any first page, and choose Save Page. This workflow will rerun automatically and seed the contributor workspace."
            exit 0
          fi

          install_if_absent() {
            source="$1"
            target="$2"
            if [ ! -e "$target" ]; then
              cp "$source" "$target"
            fi
          }

          install_if_absent contributor/wiki-templates/Domain-Rule.md "$wiki/Domain-Rule.md"
          install_if_absent contributor/wiki-templates/Edge-Case-Evaluation.md "$wiki/Edge-Case-Evaluation.md"
          install_if_absent contributor/wiki-templates/Provenance-Log.md "$wiki/Provenance-Log.md"

          if [ ! -e "$wiki/Contributor-Workspace.md" ]; then
            cat > "$wiki/Contributor-Workspace.md" <<'EOF'
          # AlphaClaw Contributor Workspace

          This is a low-friction human development path. It is separate from AlphaClaw sensory ingress and from OmegaClaw runtime authority.

          You do not need command-line Git. Choose the page that best matches what you want to contribute:

          - [[Domain Rule|Domain-Rule]] — a principle or boundary you think the project should respect.
          - [[Edge-Case Evaluation|Edge-Case-Evaluation]] — something surprising, confusing, fragile, or worth reproducing.
          - [[Provenance Log|Provenance-Log]] — a check of where a claim, result, or artifact came from.

          ## Working rhythm

          1. Open one of the three pages above and choose **Edit**.
          2. Type or dictate into the existing sections. Plain language is fine.
          3. Keep **Ready for review** as `no` while you are still thinking.
          4. Change it to `yes` only when the page says what you mean.
          5. Choose **Save Page**.

          A ready save is compiled into a review-only pull request. It does not silently change `main`, run OmegaClaw, or grant agent authority.

          Each ready save is recorded separately by its exact Wiki commit and Markdown hash, so the three working pages may be reused later without erasing earlier contributions.

          Do not place passwords, API keys, private messages, private personal information, or confidential third-party material in this public Wiki.
          EOF
          fi

          touch "$wiki/Home.md"
          if ! grep -q "alphaclaw-contributor-workspace:v1" "$wiki/Home.md"; then
            cat >> "$wiki/Home.md" <<'EOF'

          <!-- alphaclaw-contributor-workspace:v1 -->
          ## Contributor workspace

          For the low-friction human contribution path, start at [[Contributor Workspace|Contributor-Workspace]].
          EOF
          fi

          git -C "$wiki" config user.name "github-actions[bot]"
          git -C "$wiki" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wiki" add \
            Home.md \
            Contributor-Workspace.md \
            Domain-Rule.md \
            Edge-Case-Evaluation.md \
            Provenance-Log.md

          if git -C "$wiki" diff --cached --quiet; then
            echo "Contributor Wiki is already bootstrapped."
            exit 0
          fi

          git -C "$wiki" commit -m "Bootstrap low-friction contributor workspace"
          branch="$(git -C "$wiki" symbolic-ref --short HEAD)"
          git -C "$wiki" push origin "HEAD:${branch}"
