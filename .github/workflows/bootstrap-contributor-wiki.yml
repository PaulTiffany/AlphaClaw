name: Keep contributor Wiki simple

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-contributor-wiki.yml"
      - "contributor/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributor-wiki
  cancel-in-progress: true

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep one beginner contributor page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wiki=/tmp/alphaclaw-wiki
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone "$remote" "$wiki"; then
            echo "::notice title=Wiki not initialized::Create the first Wiki page once in GitHub, then run this workflow again."
            exit 0
          fi

          cp contributor/README.md "$wiki/Contributing.md"

          # Seed a real AlphaClaw Home once. Also migrate the exact generated
          # beginner Home from the previous design. After that, human edits win.
          if [ ! -e "$wiki/Home.md" ] || \
             { grep -Fq '# Make a Wiki Page' "$wiki/Home.md" && grep -Fq '**Goal: make two pages.**' "$wiki/Home.md"; }; then
            cat > "$wiki/Home.md" <<'EOF'
          # AlphaClaw

          AlphaClaw is a small sensory boundary for text-only reasoning. It keeps perception, inference, and human authority separate.

          This Wiki is the project's shared notebook. It is intentionally small and can grow as people add useful pages.

          ## Start

          - [[Contributing]] — make a Wiki page, even if you are new to GitHub.
          - [Repository](https://github.com/PaulTiffany/AlphaClaw)
          - [Philosophy](https://github.com/PaulTiffany/AlphaClaw/blob/main/PHILOSOPHY.md)

          ## What belongs here?

          Plain-language explanations, examples, observations, and other useful notes about AlphaClaw.
          EOF
          fi

          # Remove only pages created by the old teaching system, plus the
          # one known temporary Come stub. Other Wiki pages are not touched.
          rm -f \
            "$wiki/Come.md" \
            "$wiki/Start-Here.md" \
            "$wiki/Make-Another-Wiki-Page.md" \
            "$wiki/Contributor-Workspace.md" \
            "$wiki/Domain-Rule.md" \
            "$wiki/Edge-Case-Evaluation.md" \
            "$wiki/Provenance-Log.md"

          git -C "$wiki" config user.name "github-actions[bot]"
          git -C "$wiki" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wiki" add -A

          if git -C "$wiki" diff --cached --quiet; then
            echo "Wiki is already in the simple layout."
            exit 0
          fi

          git -C "$wiki" commit -m "Keep AlphaClaw Wiki Home and Contributing simple"
          branch="$(git -C "$wiki" symbolic-ref --short HEAD)"
          git -C "$wiki" push origin "HEAD:${branch}"
