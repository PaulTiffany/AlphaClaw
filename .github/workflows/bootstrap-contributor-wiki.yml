name: Keep contributor Wiki simple

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-contributor-wiki.yml"
      - "contributor/README.md"
  gollum:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributor-wiki-home
  cancel-in-progress: true

jobs:
  sync-home:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep one beginner Wiki surface
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wiki=/tmp/alphaclaw-wiki
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone "$remote" "$wiki"; then
            echo "::notice title=Wiki not initialized::Create the first Wiki page once in GitHub, then run this workflow again."
            exit 0
          fi

          cp contributor/README.md "$wiki/Home.md"

          # Remove the old teaching maze. User-authored pages are not touched.
          rm -f \
            "$wiki/Start-Here.md" \
            "$wiki/Make-Another-Wiki-Page.md" \
            "$wiki/Contributor-Workspace.md" \
            "$wiki/Domain-Rule.md" \
            "$wiki/Edge-Case-Evaluation.md" \
            "$wiki/Provenance-Log.md"

          git -C "$wiki" config user.name "github-actions[bot]"
          git -C "$wiki" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wiki" add -A

          if git -C "$wiki" diff --cached --quiet; then
            echo "Wiki Home is already simple."
            exit 0
          fi

          git -C "$wiki" commit -m "Keep beginner contributor surface to one page"
          branch="$(git -C "$wiki" symbolic-ref --short HEAD)"
          git -C "$wiki" push origin "HEAD:${branch}"
