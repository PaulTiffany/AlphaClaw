name: Publish Chad round 15 keepers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for exact-byte publication
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified source artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 \
            -o chad-raster-art.zip \
            'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-9604-81fb-a47d-b13bc91bd2ea/raw?se=2026-08-21T02%3A59%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=ae1f5ff7-0d17-5742-9978-07256f1cbff0&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T20%3A20%3A33Z&ske=2026-08-21T20%3A20%3A33Z&sks=b&skv=2026-02-06&sig=G5lMvckHfYGw0jK1IOgqvq%2BnbUcQRG9rED3bEeESclk%3D'
          printf 'zip_sha256=' && sha256sum chad-raster-art.zip
          test "$(sha256sum chad-raster-art.zip | awk '{print $1}')" = "683b0b091184311ddf466f0db5e308763fd76bebe59313de3699695fc3625c01"

      - name: Verify receipts and copy exact raster bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/publish_chad_frontier.py
          python3 .github/scripts/publish_chad_frontier.py

      - name: Commit keepers and self-delete publisher
        shell: bash
        run: |
          set -euo pipefail
          rm -f chad-raster-art.zip
          rm -rf .chad-round15-artifact __pycache__ .github/scripts/__pycache__
          git show 852166907d93564c4f071d2b774c4a5001c991b8:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/scripts/publish_chad_frontier.py
          rm -f .github/workflows/publish-chad-round15-manual.yml
          rm -f .github/workflows/publish-chad-frontier.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- PHILOSOPHY.md assets/chad/PROVENANCE.md \
            assets/chad/capability-not-permission.png \
            assets/chad/test-not-assurance.png \
            assets/chad/change-mind.jpg \
            assets/chad/mechanical-checks.png \
            assets/chad/rest-delegation.png \
            assets/chad/truth-not-winning.png \
            assets/chad/ideas-meet-reality.png \
            assets/chad/recoverable-progress.jpg \
            assets/chad/authorized-gate.png \
            assets/chad/brake-engine-path.png \
            assets/chad/strongest-criticism.png \
            .github/workflows/ci.yml \
            .github/scripts/publish_chad_frontier.py \
            .github/workflows/publish-chad-round15-manual.yml \
            .github/workflows/publish-chad-frontier.yml
          echo '--- intended staged delta ---'
          git diff --cached --name-status
          git commit -m 'Publish eleven Chad round 15 keepers'
          git push origin HEAD:main
