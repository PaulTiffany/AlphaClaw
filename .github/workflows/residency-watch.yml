name: OmegaClaw residency watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Certify pinned OmegaClaw
        run: |
          python certification/certify.py \
            --source OmegaClaw-Core \
            --output /tmp/pinned-residency.json

      - name: Fetch latest upstream OmegaClaw
        run: git clone --depth 1 https://github.com/asi-alliance/OmegaClaw-Core.git /tmp/omegaclaw-latest

      - name: Certify latest upstream OmegaClaw
        id: latest
        continue-on-error: true
        run: |
          python certification/certify.py \
            --source /tmp/omegaclaw-latest \
            --output /tmp/latest-residency.json

      - name: Stop on unwitnessed upstream mechanics
        if: steps.latest.outcome != 'success'
        run: |
          echo "Latest OmegaClaw no longer satisfies the current certification rules."
          echo "The certifier must be reviewed before AlphaClaw can bless this upstream revision."
          exit 1

      - name: Compare residency signatures
        id: compare
        shell: bash
        run: |
          set +e
          python certification/certify.py \
            --compare /tmp/pinned-residency.json /tmp/latest-residency.json
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status" -eq 3 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "$status"

      - name: Preserve changed upstream certificate
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omegaclaw-residency-change
          path: |
            /tmp/pinned-residency.json
            /tmp/latest-residency.json
          retention-days: 7

      - name: Require review when residency contract changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "OmegaClaw changed the mechanically witnessed residency contract."
          echo "Review the uploaded certificates before updating AlphaClaw's submodule pin."
          exit 1
