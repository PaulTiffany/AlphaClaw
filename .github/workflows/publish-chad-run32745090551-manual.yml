name: Publish Chad run 32745090551

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AlphaClaw main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified source artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 \
            -o chad-raster-art.zip \
            'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-a79c-81f7-8853-2528e2721473/raw?se=2026-08-24T16%3A08%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=e9842b29-d9fc-51f3-b0d0-fbc70f987ef1&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T12%3A29%3A06Z&ske=2026-08-25T12%3A29%3A06Z&sks=b&skv=2026-02-06&sig=eMd81TUWNfbSBjB4VY4ek3aNwyWpnGJqXHg4MQnVyEY%3D'
          echo "9d4dedbdad5f6cb0b4e93973b0d46f134f2f85b8b5f3caddb4d1e63427d81049  chad-raster-art.zip" | sha256sum --check -

      - name: Verify receipts and copy exact raster bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/publish_chad_run32745090551.py
          python3 .github/scripts/publish_chad_run32745090551.py

      - name: Clean temporary publication machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf chad-raster-art.zip .chad-run32745090551-artifact __pycache__ .github/scripts/__pycache__
          rm -f .github/scripts/publish_chad_run32745090551.py
          rm -f .github/workflows/publish-chad-run32745090551-manual.yml

      - name: Commit exact publication delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- PHILOSOPHY.md assets/chad/PROVENANCE.md \
            assets/chad/basic-idea.png assets/chad/judgment-scarcity.png
          git add -A -- \
            .github/scripts/publish_chad_run32745090551.py \
            .github/workflows/publish-chad-run32745090551-manual.yml

          echo "Staged publication delta:"
          git diff --cached --name-status

          test -n "$(git diff --cached --name-only)"
          git commit -m "Publish two Chad keepers from run 32745090551"
          git push origin HEAD:main
